name: PR Impact

# Reusable. Builds the impact report, comments it on the PR, and writes a
# compact summary into the PR description so it ends up in the commit message
# (Settings > General > Default commit message = "Pull request title and description").
#
# This is a report only — it is not a gate. To block merges, make the
# `tests` job in the Checks workflow a required check.
on:
  workflow_call:
    inputs:
      node-version:
        description: Node version to run on.
        type: string
        default: '24'
      tools-path:
        description: Directory this repo is checked out into, inside the caller workspace.
        type: string
        default: .ci-tools
      tools-ref:
        description: Ref of ci_workflows to take the scripts from. Keep it equal to the @ref the caller uses.
        type: string
        default: v1
    secrets:
      COPILOT_PAT:
        description: PAT for the Copilot-written prose. Without it, facts only.
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      # Caller ka code workspace root par.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scripts aur depcruise config isi repo se aate hain, caller se nahi.
      - name: Check out the shared tools
        uses: actions/checkout@v4
        with:
          repository: prasadnayak-sudo/ci_workflows
          ref: ${{ inputs.tools-ref }}
          path: ${{ inputs.tools-path }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      # graph.mjs cwd mein config dhoondta hai aur `npx depcruise` chalata hai,
      # isliye dono caller ke root par pohanchane padte hain.
      - name: Set up dependency-cruiser
        env:
          TOOLS: ${{ inputs.tools-path }}
        run: |
          cp "$TOOLS/.dependency-cruiser.cjs" .
          npm install --no-save 'dependency-cruiser@^18.3.1'

      - name: Collect changed files
        run: |
          # No --depth here: checkout already fetched full history (fetch-depth: 0),
          # and a shallow fetch would break the "git log BASE..HEAD" range.
          git fetch origin "${{ github.base_ref }}"
          BASE="origin/${{ github.base_ref }}"
          {
            echo "CHANGED_FILES<<GHEOF"
            git diff --name-only "$BASE...HEAD"
            echo "GHEOF"
            echo "COMMIT_LINES<<GHEOF"
            git log --format=%s "$BASE..HEAD"
            echo "GHEOF"
          } >> "$GITHUB_ENV"

          # Diff for the AI prompt: lock file excluded and size capped.
          git diff "$BASE...HEAD" -- . ':(exclude)package-lock.json' | head -c 60000 > /tmp/diff.txt

      - name: Build the impact report
        run: node "${{ inputs.tools-path }}/scripts/impact-report.mjs" > impact.md
        env:
          CHANGED_FILES: ${{ env.CHANGED_FILES }}

      - name: Comment on the PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-impact
          path: impact.md

      # The facts half of the description block. Always produced, with or
      # without the AI.
      - name: Build the factual summary
        env:
          CHANGED_FILES: ${{ env.CHANGED_FILES }}
          COMMIT_LINES: ${{ env.COMMIT_LINES }}
        run: node "${{ inputs.tools-path }}/scripts/commit-summary.mjs" > /tmp/facts.md

      - name: Check whether Copilot is configured
        id: check
        env:
          COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
        run: |
          if [ -n "$COPILOT_PAT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "COPILOT_PAT is not set — the commit summary will be facts only." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the Copilot prompt
        if: steps.check.outputs.enabled == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            echo "Below is the diff of a pull request."
            echo "Write the BODY of its commit message in English."
            echo
            echo "Rules:"
            echo "- Explain what changed and why. Plain prose, 2-4 short paragraphs."
            echo "- No markdown headings, no bold, no bullet lists unless truly needed."
            echo "- Do not repeat the PR title. Do not paste the diff back."
            echo "- Do not list file names or counts - that is added separately."
            echo "- Only state what the diff actually shows. Do not guess intent."
            echo "- Wrap lines at about 72 characters."
            echo
            echo "PR title: $PR_TITLE"
            echo
            echo "Diff:"
            echo '```diff'
            cat /tmp/diff.txt
            echo '```'
          } > /tmp/prompt.txt

      - name: Install the Copilot CLI
        if: steps.check.outputs.enabled == 'true'
        run: npm install -g @github/copilot

      # Best effort: if the AI step fails the description still gets the facts.
      - name: Ask Copilot to write the message
        id: ai
        if: steps.check.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          prompt-file: /tmp/prompt.txt
          model: claude-sonnet-4.5
          system-prompt: >-
            You write commit messages. Plain, specific, and short. You describe
            what changed and why it changed, never how impressive it is. Write
            in English.
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}

      # AI prose first, then the facts underneath.
      - name: Assemble the summary block
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
        run: |
          if [ -n "$AI_RESPONSE" ]; then
            {
              echo "$AI_RESPONSE"
              echo
              cat /tmp/facts.md
            } > /tmp/summary.md
          else
            cp /tmp/facts.md /tmp/summary.md
          fi

      - name: Write the summary into the PR description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          SUMMARY="$(cat /tmp/summary.md)"
          export SUMMARY
          node "${{ inputs.tools-path }}/scripts/update-pr-body.mjs" > /tmp/body.md
          gh pr edit "$PR_NUMBER" --body-file /tmp/body.md
