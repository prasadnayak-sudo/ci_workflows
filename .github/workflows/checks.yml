name: Checks

# Reusable gate. Caller repo isko is tarah bulata hai:
#
#   jobs:
#     checks:
#       uses: prasadnayak-sudo/ci_workflows/.github/workflows/checks.yml@v1
#
# Branch protection mein isi job ko required banao — merge yahin rukta hai.
on:
  workflow_call:
    inputs:
      node-version:
        description: Node version to run on.
        type: string
        default: '24'
      typecheck-command:
        description: Type check. Khaali string dene par step skip ho jaata hai.
        type: string
        default: 'npx tsc -b'
      lint-command:
        type: string
        default: 'npm run lint'
      test-command:
        type: string
        default: 'npm test'
      install-command:
        description: Lockfile na ho to "npm install" pass karo.
        type: string
        default: 'npm ci'

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    concurrency:
      group: checks-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Check TypeScript
        if: inputs.typecheck-command != ''
        run: ${{ inputs.typecheck-command }}

      - name: Check lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      - name: Run tests
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}
